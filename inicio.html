<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos Legales | CoachProStats</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #2D3446; --bg-light: #F8FAFC; --primary-orange: #FF7A00; --text-light: #FFFFFF; --text-dark: #1A1E29; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-light); color: var(--text-dark); line-height: 1.7; }
        a { text-decoration: none; }
        .navbar { position: fixed; top: 0; width: 100%; background-color: rgba(45, 52, 70, 0.95); backdrop-filter: blur(10px); z-index: 1000; padding: 10px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-logo img { max-height: 60px; width: auto; display: block; }
        .nav-links { list-style: none; display: flex; gap: 35px; }
        .nav-links a { color: var(--text-light); font-weight: 600; font-size: 1rem; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-orange); }
        .legal-index-section { padding: 160px 20px 100px 20px; background-color: var(--bg-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .legal-index-container { max-width: 600px; width: 100%; background: #FFFFFF; padding: 50px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 4px solid var(--primary-orange); text-align: center; }
        .legal-index-container h1 { font-size: 2.2rem; color: var(--bg-dark); margin-bottom: 10px; font-weight: 800; }
        .legal-index-container p { color: #666; margin-bottom: 40px; font-size: 1rem; }
        .legal-links { display: flex; flex-direction: column; gap: 15px; }
        .legal-link-card { display: flex; align-items: center; justify-content: space-between; background-color: #F8FAFC; padding: 20px 25px; border-radius: 10px; border: 1px solid #E2E8F0; transition: all 0.3s ease; }
        .legal-link-card:hover { background-color: #FFFFFF; border-color: var(--primary-orange); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 122, 0, 0.1); }
        .legal-link-text { font-weight: 600; color: var(--bg-dark); font-size: 1.1rem; }
        .legal-link-card:hover .legal-link-text { color: var(--primary-orange); }
        .arrow-icon { color: var(--primary-orange); font-size: 1.2rem; font-weight: bold; transition: transform 0.3s ease; }
        .legal-link-card:hover .arrow-icon { transform: translateX(5px); }
        @media (max-width: 900px) { .nav-links { display: none; } .legal-index-section { padding-top: 120px; } .legal-index-container { padding: 30px 20px; } .legal-index-container h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.md" class="nav-logo">
                <img src="https://raw.githubusercontent.com/ardielmm/coachprostats-legal/main/logo-potential.png" alt="PD Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.md" class="active">Inicio</a></li>
                <li><a href="privacy.md">Privacidad</a></li>
                <li><a href="terms.md">Términos</a></li>
                <li><a href="delete-account.html">Eliminar Cuenta</a></li>
            </ul>
        </div>
    </nav>

    <section class="legal-index-section">
        <div class="legal-index-container">
            <h1>CoachProStats</h1>
            <p>Centro de Documentos Legales y Transparencia</p>
            <div class="legal-links">
                <a href="privacy.md" class="legal-link-card">
                    <span class="legal-link-text">Política de Privacidad</span>
                    <span class="arrow-icon">&rarr;</span>
                </a>
                <a href="terms.md" class="legal-link-card">
                    <span class="legal-link-text">Términos y Condiciones</span>
                    <span class="arrow-icon">&rarr;</span>
                </a>
                <a href="delete-account.html" class="legal-link-card">
                    <span class="legal-link-text">Eliminación de Cuenta y Datos</span>
                    <span class="arrow-icon">&rarr;</span>
                </a>
            </div>
        </div>
    </section>

</body>
</html>
